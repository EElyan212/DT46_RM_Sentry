/**:
    ros__parameters:
        # --- 算法基础设置 ---
        feature_extract_enable: false # 是否提取特征点（线/面）。Fast-LIO2/Point-LIO通常关闭，直接使用原始点云（Direct Method）
        point_filter_num: 3           # 点云下采样间隔。每隔多少个点取一个，值越大计算越快但精度降低
        max_iteration: 3              # IESKF 迭代最大次数。在保证收敛的前提下，减小此值可提升实时性
        filter_size_surf: 0.5         # 局部地图的体素滤波尺寸（米）。用于匹配寻找最近邻
        filter_size_map: 0.5          # 全局地图的体素滤波尺寸（米）。影响渲染和保存地图的稀疏程度
        cube_side_length: 1000.0      # ikd-Tree 维护的局部地图边长（米）
        runtime_pos_log_enable: false # 是否实时记录位姿日志到本地文件（Log文件夹下）
        map_file_path: "./test.pcd"   # PCD 地图文件保存路径。建议改为绝对路径防止段错误（Segmentation Fault）

        # --- 通信话题设置 ---
        common:
            lid_topic:  "/livox/lidar"    # 雷达数据话题名
            imu_topic:  "/livox/imu"      # IMU 数据话题名
            time_sync_en: false           # 是否开启软件时间同步。硬件对时（如PTP/GPS）不可用时才开启
            time_offset_lidar_to_imu: 0.0 # 雷达相对于 IMU 的固定时间偏置补偿（秒）

        # --- 数据预处理设置 ---
        preprocess:
            lidar_type: 1                # 雷达类型：1-Livox, 2-Velodyne, 3-Ouster
            scan_line:  4                # 扫描线数。对于Mid-360，此参数会影响驱动的数据提取逻辑
            blind: 0.5                   # 盲区距离（米）。剔除雷达中心 0.5m 以内的点，防止扫到机器人自身
            timestamp_unit: 3            # 时间戳单位：0-ms, 1-ns, 2-us, 3-ns (Livox驱动通常选3)
            scan_rate: 10                # 雷达扫描频率（Hz）

        # --- 状态估计与外参标定 ---
        mapping:
            acc_cov: 0.1                 # 加速度计噪声协方差。值越大表示越不信任加速度计
            gyr_cov: 0.1                 # 陀螺仪噪声协方差。值越大表示越不信任陀螺仪
            b_acc_cov: 0.0001            # 加速度计零偏随机游走噪声
            b_gyr_cov: 0.0001            # 陀螺仪零偏随机游走噪声
            fov_degree:    360.0         # 视场角限制。Mid-360 为全向雷达，设为 360
            det_range:     100.0         # 最大有效量程（米）
            extrinsic_est_en:  true      # 是否开启在线外参估计。设为true时，算法会实时修正T和R
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ] # 雷达相对于 IMU 的平移外参 [x, y, z]
            extrinsic_R: [ 1., 0., 0.,                 # 雷达相对于 IMU 的旋转矩阵（3x3）
                            0., -1., 0.,               # 当前矩阵表示 Y 轴和 Z 轴与 IMU 相反
                            0., 0., -1.]

        # --- 数据发布控制 ---
        publish:
            path_en: false                # 是否发布轨迹路径（Path消息）
            effect_map_en: false          # 是否发布当前参与配准的有效点云（调试用）
            map_en: false                 # 是否实时发布构建的全局地图
            scan_publish_en:  true       # 是否发布当前帧去畸变后的点云
            dense_publish_en: true      # 是否发布稠密点云
            scan_bodyframe_pub_en: true  # 是否发布以 IMU 为中心（Body系）的去畸变点云

        # --- 地图保存 ---
        pcd_save:
            pcd_save_en: true            # 程序结束或通过服务触发时是否保存 PCD 地图
            interval: -1                 # 保存间隔：-1表示所有帧存入一个文件；正数表示分段保存