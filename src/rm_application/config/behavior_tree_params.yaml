behavior_tree_node:
  ros__parameters:
    # 调试阶段先关闭控制区限制，边界确定后再开启
    control_zone_enabled: true

    # 控制区在 map 坐标系下的矩形边界，单位：米
    # 当前数值仅占位
    control_zone_x_min: 2.0
    control_zone_x_max: 4.0
    control_zone_y_min: 1.0
    control_zone_y_max: 3.0

    # 是否启用最大追击区域限制
    # 具体边界坐标确定前保持 false
    chase_boundary_enabled: true

    # 最大追击区域在 map 坐标系下的矩形边界，单位：米
    # 当前数值仅占位，之后通过 RViz 确定
    chase_boundary_x_min: 2.0
    chase_boundary_x_max: 4.0
    chase_boundary_y_min: 0.0
    chase_boundary_y_max: 4.0

    # 从最近一次有效跟踪计时，超过此时间就退出追击任务
    # 宽限期间不沿用旧目标运动，视觉超时由共用vision_timeout配置
    target_lost_grace_time: 0.5
    # 追击和允许的重试都失败后，暂停追击多久，单位：秒
    # 这段时间由行为树选择回控制区或巡逻；时间到后重新判断能否追击
    chase_failure_cooldown_seconds: 1.0

    # 回补给血量阈值
    hp_limit: 150
    hp_up: 400

    # 占点目标和补给点，使用 map 坐标，单位：米
    center: [3.0, 2.0]
    home: [0.65, 0.15]

    # 是否开启巡逻；关闭后，原本需要巡逻时改为停车
    # 不影响追击、区外回点和回血
    patrol_enabled: true

    # 中央控制区内三个巡逻子区域的矩形边界
    # 顺序：[x_min, x_max, y_min, y_max]
    # 当前暂用 0 占位，之后在 RViz 中确定实际边界
    patrol_home_area: [2.0, 2.6, 1.0, 3.0]
    patrol_center_area: [2.6, 3.3, 1.0, 3.0]
    patrol_enemy_area: [3.3, 4.0, 1.0, 3.0]

    # 随机目标与机器人当前位置至少相距多少米
    patrol_min_goal_distance: 0.5

    # 以后回血换点时允许选点的矩形范围，使用 map 坐标，单位：米
    resupply_x_min: 0.3
    resupply_x_max: 1.0
    resupply_y_min: -0.1
    resupply_y_max: 0.4

    # 占点：去控制区失败后换一个点继续走，连续换点失败达到次数后才等待
    # 换的新点至少要离刚刚失败的那个目标多远，单位：米
    occupy_recovery_min_goal_distance: 0.5
    # 为选出一个备用点，最多随机生成并检查多少个候选坐标
    # 找到距离合适的坐标就停止选点；这些检查不会发送导航目标
    # 全部不合适时不发导航，下次继续选，也不计入下面的导航重试次数
    occupy_recovery_sample_attempts: 20
    # 默认目标失败后，最多依次导航到多少个备用点；不包含默认目标
    # 这些备用点全部导航失败后才等待；等完再尝试同样数量的新备用点
    # 成功到达会清零连续失败次数
    occupy_recovery_max_retries: 5
    # 达到上面的失败次数后等多久，再继续换点导航，单位：秒
    # 单个备用点失败后不固定等待；旧导航结束后即可换下一个点
    occupy_recovery_wait_seconds: 0.5

    # 巡逻：每次导航失败都先等待，再在当前巡逻范围内换点
    # 换的新点至少要离刚刚失败的那个目标多远，单位：米
    patrol_recovery_min_goal_distance: 0.5
    # 为选出一个备用点，最多随机生成并检查多少个候选坐标
    # 找到距离合适的坐标就停止选点；全不合适时不发导航，后续再选
    patrol_recovery_sample_attempts: 20
    # 每轮第一次导航失败后，还能换点导航多少次；不包含第一次导航
    # 这些尝试全部失败后结束本轮；仍需巡逻时，等待并选点开始下一轮
    patrol_recovery_max_retries: 5
    # 每次巡逻导航失败后，等多久再换点导航，单位：秒
    patrol_recovery_wait_seconds: 0.5

    # 回血：在补给区内换点，连续换点失败达到次数后才等待
    # 新点离刚失败目标的最小距离，单位：米
    resupply_recovery_min_goal_distance: 0.2
    # 选一个备用点时，最多检查多少个候选坐标
    resupply_recovery_sample_attempts: 20
    # 默认目标失败后，还能换点导航多少次；不包含默认目标
    # 这些备用点全部失败后才等待；等完再尝试同样数量的新备用点
    resupply_recovery_max_retries: 15
    # 连续换点失败达到次数后，等多久再换点导航，单位：秒
    resupply_recovery_wait_seconds: 0.5

    # 追击：已有失败后重新追击的功能，目标由追击服务计算，不随机选点
    # 第一次追击失败后，还能重新启动追击多少次；不包含第一次
    # 重试也全部失败后，按 chase_failure_cooldown_seconds 暂停追击
    chase_recovery_max_retries: 1
    # 追击失败后，等多久再进行下一次允许的重试，单位：秒
    chase_recovery_wait_seconds: 0.5

    # 战术模式来源：manual 为 RQT 手动选择，auto 为自动评分
    tactical_mode_source: "manual"
    # 候选战术连续满足条件多久后才允许切换，单位：秒
    tactical_confirm_seconds: 2.0
    # 当前战术最短保持时间，单位：秒；0 表示暂不限制
    tactical_min_hold_seconds: 0.0

    # 评分因子、权重和上限按相同顺序对应
    # 自身血量 60%，步兵血量 30%，掉血安全程度 10%
    # 重装和发弹量保留输入，权重为 0，不参与评分
    tactical_score_factors: ["self_hp", "heavy_hp", "infantry_hp", "remain_bullet", "damage_safety"]
    tactical_score_weights: [0.6, 0.0, 0.3, 0.0, 0.1]
    # 哨兵上限 400，血量优先步兵上限 350，安全程度范围为 0～1
    tactical_score_maxima: [400.0, 0.0, 350.0, 750.0, 1.0]

    # 统计最近 2 秒内观察到的累计掉血
    tactical_score_damage_window_seconds: 2.0
    # 初始调试值：每秒掉血 50 时，掉血安全程度降至 0
    tactical_score_damage_full_rate: 50.0
    # 消息接收中断超过 1 秒时，不使用旧数据继续评分
    tactical_score_damage_input_timeout: 1.0

    # 临时测试阈值；模式保持和候选确认时间继续使用现有配置
    tactical_score_defense_enter: 0.35
    tactical_score_defense_exit: 0.45
    tactical_score_pressure_exit: 0.65
    tactical_score_pressure_enter: 0.75
