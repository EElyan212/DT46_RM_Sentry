behavior_tree_node:
  ros__parameters:
    # 调试阶段先关闭控制区限制，边界确定后再开启
    control_zone_enabled: false

    # 控制区在 map 坐标系下的矩形边界，单位：米
    # 当前数值仅占位
    control_zone_x_min: 0.0
    control_zone_x_max: 0.0
    control_zone_y_min: 0.0
    control_zone_y_max: 0.0

    # 是否启用最大追击区域限制
    # 具体边界坐标确定前保持 false
    chase_boundary_enabled: false

    # 最大追击区域在 map 坐标系下的矩形边界，单位：米
    # 当前数值仅占位，之后通过 RViz 确定
    chase_boundary_x_min: 0.0
    chase_boundary_x_max: 0.0
    chase_boundary_y_min: 0.0
    chase_boundary_y_max: 0.0

    # 追击过程中短暂丢失目标时的等待时间，单位：秒
    # 在此时间内重新跟踪到敌人，则继续追击
    target_lost_grace_time: 0.5

    # 回补给血量阈值
    hp_limit: 150
    hp_up: 380
  
    # 占点目标和补给点，使用 map 坐标，单位：米
    center: [4.86, -2.39]
    home: [-0.233, 0.833]

    # 是否启用占点期间的受击闪避
    # false 时即使收到 /armor/hit 也不会移动
    hit_evade_enabled: false

    # 每次选择闪避目标点时的移动距离，单位：米
    hit_evade_distance: 0.6

    # 最后一次有效受击后继续动态移动的时间，单位：秒
    hit_evade_quiet_time: 4.0

    # 闪避目标与控制区边界之间保留的安全距离，单位：米
    # 用于避免机器人中心未越界但车体已经越界
    control_zone_margin: 0.25