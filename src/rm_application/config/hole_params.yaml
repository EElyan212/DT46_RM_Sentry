hole_detector:
  ros__parameters:
    enabled: true
    # 隧道的矩形
    hole_x_min: -0.5
    hole_x_max: 0.5
    hole_y_min: 1.41
    hole_y_max: 2.5

    pre_stop_distance: 1.0  # 到入口多少距离停下
    path_timeout: 15.0      # 路径超时时间（导航重规划间隔较大时避免误判超时）
    inside_debounce_time: 1.0  # 进出洞判定去抖时间，防止洞口边界抖动
    publish_rate: 10.0      # 判定频率
    map_frame: map
    robot_frame: base_footprint
    plan_topic: /plan
    status_topic: /hole/status

hole_behavior:
  ros__parameters:
    hole_status_topic: /hole/status
    hole_block_topic: /hole/block
    gimbal_complete_topic: /gimbal/action_complete
    gimbal_exit_complete_topic: /gimbal/exit_action_complete
    post_exit_distance: 1.0    # 离开出口多少距离停下
    status_timeout: 1.0
    block_on_missing_status: true
    publish_rate: 10.0
