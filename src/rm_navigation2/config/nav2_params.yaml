amcl:
  ros__parameters:
    # --- 基础框架与时间配置 ---
    use_sim_time: False           # 是否使用仿真时间 (真机设为 False，仿真环境设为 True)
    base_frame_id: "base_footprint"    # 机器人的中心坐标系 (通常是 base_footprint)
    odom_frame_id: "odom"         # 里程计坐标系
    global_frame_id: "map"        # 全局地图坐标系
    tf_broadcast: true            # 是否发布 map 到 odom 的 TF 变换
    transform_tolerance: 0.19      # TF 变换允许的最大延迟 (秒)，用于补偿系统滞后

    # --- 运动模型 (里程计) 参数 ---
    # 定义机器人运动时的噪声，数值越大表示里程计越不可信，粒子散开越快
    robot_model_type: "nav2_amcl::OmniMotionModel" # 运动模型类型 (此处为全向移动模型)
    alpha1: 0.1                   # 旋转运动导致的旋转噪声
    alpha2: 0.1                   # 平移运动导致的旋转噪声
    alpha3: 0.1                   # 平移运动导致的平移噪声
    alpha4: 0.1                   # 旋转运动导致的平移噪声
    alpha5: 0.1                   # (仅限全向模型) 平移导致的额外平移噪声

    # --- 激光雷达传感器模型参数 ---
    laser_model_type: "likelihood_field" # 激光模型类型 (常用似然场模型，计算开销小)
    scan_topic: scan              # 订阅的激光雷达数据话题名称
    reliability: "best_effort"    # DDS 通信可靠性 (通常选 best_effort 以降低延迟)
    laser_min_range: -1.0         # 激光扫描有效最小距离 ( -1.0 表示使用传感器默认值)
    laser_max_range: 10.0         # 激光扫描有效最大距离
    max_beams: 60                # 更新过滤器时使用的激光束数量 (减少此值可降低 CPU 占用)
    laser_likelihood_max_dist: 5.0 # 在地图上寻找障碍物的最大距离

    # --- 传感器误差权重 (总和应接近 1.0) ---
    z_hit: 0.9                    # 测量值符合地图的权重
    z_rand: 0.1                   # 测量值完全随机的权重
    z_short: 0.05                 # 测量值比预期短的权重 (如遇到动态障碍物)
    z_max: 0.05                   # 测量值为最大量程的权重
    sigma_hit: 0.2                # z_hit 部分的高斯分布标准差
    lambda_short: 0.1             # z_short 指数分布参数

    # --- 粒子滤波核心参数 ---
    min_particles: 1000           # 过滤器允许的最小粒子数
    max_particles: 5000           # 过滤器允许的最大粒子数 (粒子多精度高，但耗 CPU)
    pf_err: 0.05                  # 粒子滤波器的最大误差
    pf_z: 0.99                    # 用于 KLD 采样的分位数
    resample_interval: 1          # 重新采样的间隔 (1 表示每次更新后都采样)

    # --- 更新触发阈值 ---
    update_min_d: 0.1            # 机器人平移超过此距离 (米) 才触发滤波器更新
    update_min_a: 0.05            # 机器人旋转超过此角度 (弧度) 才触发滤波器更新
    save_pose_rate: 0.5           # 保存估计位姿到磁盘的频率 (Hz)

    # --- 恢复与自动定位功能 ---
    recovery_alpha_slow: 0.0      # 慢速指数滤波器的衰减率 (0.0 表示禁用自动恢复)
    recovery_alpha_fast: 0.0      # 快速指数滤波器的衰减率 (0.0 表示禁用自动恢复)

    # --- 初始位姿设置 ---
    set_initial_pose: true        # 是否根据下方参数设置启动时的初始位姿
    x: 10.15                 # 初始位置 X (米)
    y: -3.84                # 初始位置 Y (米)
    yaw: 0.00               # 初始朝向 Yaw (弧度)

    # --- 束跳过 (Beam Skip) 功能 (用于应对动态障碍物) ---
    do_beamskip: false            # 是否开启跳过与地图不匹配激光束的功能
    beam_skip_distance: 0.5       # 判定为不匹配的距离阈值
    beam_skip_error_threshold: 0.9 # 跳过激光束的最大比例
    beam_skip_threshold: 0.3      # 触发跳过所需的最小粒子比例


