bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 200.0    # 局部控制器更新频率 (Hz)
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3        # 控制器插件允许的失败容差
    progress_checker_plugin: "progress_checker" # 进度检查插件
    goal_checker_plugins: ["general_goal_checker"] # 目标到达检查插件
    controller_plugins: ["FollowPath"] # 控制器算法插件

    # 进度检查参数：确保机器人没有在原地打转或被卡住
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # 在指定时间内必须移动的最短距离 (m)
      movement_time_allowance: 10.0  # 允许机器人不移动的最大时间 (s)
    
    # 目标检查参数：判断是否到达目的地
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15     # 目标位置容差 (m)
      yaw_goal_tolerance: 4.0      # 目标角度容差 (rad)，4.0 表示角度要求非常宽松
    
    # DWB 局部规划器参数
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.35            # 后退最大速度 (m/s)
      min_vel_y: -0.35            # 横向平移最小速度 (m/s)
      max_vel_x: 0.35             # 前进最大速度 (m/s)
      max_vel_y: 0.35             # 横向平移最大速度 (m/s)
      max_vel_theta: 0.0          # 旋转最大速度 (若需旋转需调整此值)
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 20.0             # X方向加速度限制
      acc_lim_y: 20.0
      acc_lim_theta: 0.0          # 旋转加速度限制
      decel_lim_x: -2.5           # X方向减速度限制
      decel_lim_y: -2.5
      decel_lim_theta: 0.0
      vx_samples: 30              # X轴速度采样点数量
      vy_samples: 30              # Y轴速度采样点数量
      vtheta_samples: 0           # 旋转速度采样点数量
      sim_time: 2.0               # 前向模拟轨迹的时间 (s)
      linear_granularity: 0.05    # 线性模拟步长
      angular_granularity: 0.025   # 角度模拟步长
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03 # 判定为停止的平移速度阈值
      short_circuit_trajectory_evaluation: True # 找到有效轨迹后是否立即停止计算
      stateful: True
      # 评价函数 (Critics)：用于评估候选路径的优劣
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 250.0   # 避障权重 (越高越远离障碍物)
      PathAlign.scale: 32.0       # 路径对齐权重
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0       # 目标对齐权重
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0        # 贴合路径权重
      GoalDist.scale: 24.0        # 趋向目标权重
      RotateToGoal.scale: 32.0    # 旋转指向目标权重
      RotateToGoal.slowing_factor: 0.0
      RotateToGoal.lookahead_time: -1.0
      holonomic_robot: true       # 是否为全向移动机器人

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 30.0      # 地图更新频率 (Hz)
      publish_frequency: 10.0     # 地图可视化话题发布频率 (Hz)
      global_frame: odom          # 局部地图参考系 (通常用 odom)
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true        # 滑动窗口模式 (地图随机器人移动)
      width: 5                    # 局部地图宽度 (m)
      height: 5                   # 局部地图高度 (m)
      resolution: 0.05            # 分辨率 (m/cell)
      robot_radius: 0.25          # 机器人外接圆半径 (m)
      plugins: ["voxel_layer", "inflation_layer"] # 使用的图层
      
      # 膨胀层：将障碍物边界扩大，防止机器人撞击
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  # 指数衰减因子
        inflation_radius: 0.3     # 膨胀半径 (m)
      
      # 体素层：处理 3D 障碍物或激光数据
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan            # 激光话题
          max_obstacle_height: 2.0
          clearing: True          # 射线清除旧障碍物
          marking: True           # 标记新障碍物
          data_type: "LaserScan"
          reliability: "best_effort"
          raytrace_max_range: 3.0 # 射线追踪清除最大范围
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 # 障碍物标记最大范围
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map           # 全局地图参考系
      robot_base_frame: base_link
      use_sim_time: False
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      # 障碍物层：在全局地图上更新实时检测到的障碍物
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          reliability: "best_effort"
          raytrace_max_range: 3.0
          raytrace_min_range: 1.0
          obstacle_max_range: 2.5
          obstacle_min_range: 1.0
      
      # 静态层：读取由 map_server 发布的地图数据
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True # 瞬时本地订阅模式
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.5
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""             # 地图文件路径 (通常在 Launch 中指定)

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25     # 判定为空闲的阈值
    occupied_thresh_default: 0.65 # 判定为占据的阈值
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0 # 全局规划器的频率
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5              # 允许规划不到位姿的容差 (m)
      use_astar: false            # 是否使用 A* (False 则使用 Dijkstra)
      allow_unknown: true         # 是否允许在未知区域规划路径

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10          # 平滑计算容差
      max_its: 1000               # 最大迭代次数
      do_refinement: True         # 是否进行精细化处理

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0         # 恢复行为检查频率
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    # 定义各种恢复行为 (Recovery Behaviors)
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 2.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0       # 恢复行为中的最大旋转速度
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false        # 某个航点失败后是否停止后续任务
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200 # 在每个航点停留的时间 (ms)

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0     # 输出指令的平滑频率
    scale_velocities: False
    feedback: "OPEN_LOOP"         # 反馈模式：开环控制
    max_velocity: [2.5, 2.5, 12.0] # [x, y, theta] 最大速度
    min_velocity: [-2.5, -2.5, -12.0]
    max_accel: [5.0, 5.0, 15.0]    # 最大加速度
    max_decel: [-5.0, -5.0, -15.0] # 最大减速度
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0] # 死区速度 (低于此值设为0)
    velocity_timeout: 1.0          # 输入指令超时时间